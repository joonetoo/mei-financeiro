<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Neto Filmes — Controle Financeiro</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#F2EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Controle MEI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  /* "Extrato claro" — fundo creme + barra lateral escura, acentos foscos
     (verde-oliva, dourado, lavanda) no lugar do azul neon com brilho. */
  --bg:#F2EEE3;
  --surface:#FFFFFF;
  --surface-wash:#F8F5EE;

  --sidebar:#211D18;
  --sidebar-raised:#2B2418;
  --sidebar-active:#3A2F1C;
  --sidebar-active-ink:#F1DFB8;
  --sidebar-ink:#F2EEE3;
  --sidebar-ink-soft:#B9B2A6;
  --sidebar-ink-faint:#8B8272;
  --sidebar-hairline:rgba(255,255,255,0.08);
  --sidebar-hairline-strong:rgba(255,255,255,0.18);

  --ink:#211D18;
  --ink-soft:#5A5344;
  --ink-faint:#6E675C;
  --hairline:rgba(34,30,25,0.09);
  --hairline-strong:rgba(34,30,25,0.18);

  --sage:#5F7248;
  --sage-wash:#DCE3CD;
  --sage-deep:#3E4A2E;

  --gold:#8A6416;
  --gold-wash:#F3E1B8;
  --gold-deep:#5B430E;

  --lavender:#4A4C81;
  --lavender-wash:#E2E1F0;
  --lavender-deep:#33355C;

  /* nomes mantidos porque src/main.js os referencia diretamente (gauge SVG) */
  --slate:#5F7248;
  --accent-soft:#C99A44;
  --accent-wash:rgba(138,100,22,0.12);

  --status-ok:#3E4A2E;
  --status-ok-wash:#DCE3CD;
  --status-warn:#5B430E;
  --status-warn-wash:#F3E1B8;
  --danger:#A6402E;
  --danger-wash:rgba(166,64,46,0.12);

  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(34,30,25,.10);
  --shadow-card:0 10px 24px -16px rgba(34,30,25,.20);
  --shadow-hover:0 16px 32px -18px rgba(34,30,25,.26);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:14px; --text-md:15px; --text-lg:17px; --text-xl:21px; --text-2xl:26px; --text-3xl:34px;
  --ease:cubic-bezier(.22,.9,.32,1);
  --ease-slide:cubic-bezier(.66,.01,.24,1.02);
  --dur-fast:150ms; --dur-base:220ms; --dur-slide:440ms; --dur-fill:500ms; --dur-ring:600ms;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Public Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  #app *, #app *::before, #app *::after{
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}
@keyframes rowFadeUp{from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}
.row-enter{opacity:0;animation:rowFadeUp .4s var(--ease) forwards;}
.row-enter:nth-child(1){animation-delay:.02s;} .row-enter:nth-child(2){animation-delay:.05s;}
.row-enter:nth-child(3){animation-delay:.08s;} .row-enter:nth-child(4){animation-delay:.11s;}
.row-enter:nth-child(5){animation-delay:.14s;} .row-enter:nth-child(6){animation-delay:.17s;}
.row-enter:nth-child(7){animation-delay:.20s;} .row-enter:nth-child(8){animation-delay:.23s;}

/* -------- privacy / sensitive values --------
   Bolinhas em vez de desfoque, como em app de banco — cada caractere vira um
   ponto (o valor real continua ali, so o desenho do texto muda). */
body.privacy-on .sensitive{-webkit-text-security:disc;user-select:none;}

#app{
  max-width:1180px;
  margin:0 auto;
  padding:20px 20px 64px;
}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:6px 4px 20px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.brand h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .sub{
  font-size:12px;
  color:var(--ink-faint);
  margin-top:4px;
}
.savestate{
  font-size:12px;
  color:var(--ink-faint);
  white-space:nowrap;
}
.savestate.saving{color:var(--gold-deep);}

.topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.privacy-toggle{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-pill);
  border:1px solid var(--hairline-strong);
  color:var(--ink-soft);font-size:12.5px;font-weight:600;
  background:var(--surface);
  box-shadow:var(--shadow-card);
}
.privacy-toggle:hover{color:var(--ink);}
.privacy-toggle.active{color:var(--gold-deep);border-color:var(--gold);}
.privacy-toggle svg{display:block;flex:0 0 auto;}
.privacy-toggle svg[hidden]{display:none;}

/* ---------- Stats row ----------
   Um heroi (quanto ainda cabe no limite — o numero que decide se da pra
   aceitar mais trabalho) e dois coadjuvantes, no lugar de quatro cartoes
   de peso igual. Cada um leva um tom pastel diferente (verde/dourado/
   lavanda), como na referencia. */
.stats-row{display:flex;gap:14px;margin-bottom:20px;align-items:stretch;}
.stat-hero{
  flex:1 1 0;min-width:0;
  background:var(--sage-wash);border:1px solid rgba(95,114,72,0.35);border-radius:var(--radius-lg);
  padding:20px 22px;box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;gap:13px;
  opacity:0;animation:rowFadeUp .45s var(--ease) .02s forwards;
}
.stat-side{flex:0 0 400px;display:flex;flex-direction:column;gap:14px;}
.stat-card-sm{
  flex:1 1 0;
  background:var(--gold-wash);border:none;border-radius:var(--radius-lg);
  padding:14px 18px;box-shadow:var(--shadow-card);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  transition:transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
  opacity:0;animation:rowFadeUp .45s var(--ease) forwards;
}
.stat-side .stat-card-sm:nth-child(2){background:var(--lavender-wash);}
.stat-card-sm:nth-child(1){animation-delay:.06s;} .stat-card-sm:nth-child(2){animation-delay:.10s;}
.stat-card-sm:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);}
.stat-label{font-size:var(--text-2xs);color:var(--sage-deep);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-card-sm .stat-label{color:var(--gold-deep);}
.stat-side .stat-card-sm:nth-child(2) .stat-label{color:var(--lavender-deep);}
.stat-value{font-family:'Fraunces',serif;font-size:var(--text-2xl);font-weight:600;letter-spacing:-.01em;color:var(--gold-deep);white-space:nowrap;font-variant-numeric:tabular-nums;}
.stat-side .stat-card-sm:nth-child(2) .stat-value{color:var(--lavender-deep);}
.stat-hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.stat-hero-value{font-family:'Fraunces',serif;font-size:42px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--sage-deep);white-space:nowrap;font-variant-numeric:tabular-nums;}
.stat-hero-msg{font-size:13.5px;line-height:1.5;color:var(--ink-soft);}
.stat-hero-msg b{color:var(--sage-deep);font-weight:600;}
.stat-pill{font-size:var(--text-2xs);font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);flex:0 0 auto;}
/* barra do limite: preenchimento = quanto ja foi faturado, marca ambar =
   onde o ano ja andou. Barra atras da marca = folga. */
.limit-bar{position:relative;height:10px;border-radius:6px;background:rgba(46,56,33,0.16);}
.limit-fill{height:10px;border-radius:6px;background:var(--sage);transition:width var(--dur-fill) var(--ease);}
.limit-fill.warn{background:var(--status-warn);}
.limit-fill.danger{background:var(--danger);}
.limit-pace{position:absolute;top:-5px;width:2px;height:20px;border-radius:1px;background:var(--status-warn);}
.limit-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--ink-soft);}
.limit-foot .pace{color:var(--status-warn);}
.stat-pill.ok{background:var(--status-ok-wash);color:var(--status-ok);}
.stat-pill.warn{background:var(--status-warn-wash);color:var(--status-warn);}
.stat-pill.danger{background:var(--danger-wash);color:var(--danger);}

/* ---------- Layout: rail + main ---------- */
.layout{
  display:flex;
  gap:22px;
  align-items:flex-start;
}
.rail{
  flex:0 0 216px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--sidebar);
  border:1px solid var(--sidebar-hairline);
  border-radius:var(--radius-lg);
  padding:14px;
  position:sticky;
  top:16px;
}
.rail-group-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--sidebar-ink-faint);
  padding:8px 10px 4px;
}
.rail-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none; border-radius:var(--radius-sm);
  background:rgba(201,154,68,0.16); border:1px solid var(--gold);
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide), opacity var(--dur-base) ease;
  will-change:transform,width,height; opacity:0;
}
.tab-btn{
  position:relative; z-index:1;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  background:transparent;
  border:none;
  padding:10px 12px;
  font-size:14px;
  font-weight:500;
  color:var(--sidebar-ink-soft);
  border-radius:var(--radius-sm);
  transition:color var(--dur-base) var(--ease);
}
.tab-btn:hover:not(.active){color:var(--sidebar-ink);}
.tab-btn.active{color:var(--sidebar-active-ink);font-weight:600;}
.tab-chip{
  width:28px;height:28px;border-radius:var(--radius-xs);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:'Public Sans',sans-serif;font-weight:700;font-size:11.5px;
  background:rgba(255,255,255,0.08);color:var(--sidebar-ink-soft);
}
.tab-btn .tab-label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab-btn .tag{
  font-size:11px;
  color:inherit;
  opacity:0.85;
  flex:0 0 auto;
}
.tab-chip.chip-0{background:rgba(95,114,72,0.28);color:#BFD0A6;}
.tab-chip.chip-1{background:rgba(138,100,22,0.32);color:#E7C077;}
.tab-chip.chip-2{background:rgba(74,76,129,0.34);color:#BCBEE4;}
.client-avatar.chip-0{background:var(--sage-wash);color:var(--sage-deep);}
.client-avatar.chip-1{background:var(--gold-wash);color:var(--gold-deep);}
.client-avatar.chip-2{background:var(--lavender-wash);color:var(--lavender-deep);}

.rail-divider{
  height:1px;
  background:var(--sidebar-hairline);
  margin:8px 6px;
}
.rail-add{
  margin-top:6px;
  padding:9px 14px;
  font-size:13px;
  color:var(--gold);
  background:none;
  border:1px dashed var(--sidebar-hairline-strong);
  border-radius:var(--radius-sm);
  text-align:left;
}
.rail-add:hover{background:rgba(201,154,68,0.12);}
.rail-add-form{
  margin-top:6px;
  padding:12px;
  background:var(--sidebar-raised);
  border:1px solid var(--sidebar-hairline-strong);
  border-radius:var(--radius-md);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.rail-add-form input{
  padding:8px 10px;
  border:1px solid var(--sidebar-hairline-strong);
  border-radius:var(--radius-md);
  background:rgba(255,255,255,0.05);
  color:var(--sidebar-ink);
}
.rail-add-form .row{display:flex;gap:6px;}
.rail-add-form > .row > button{
  padding:8px 12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--sidebar);
  font-weight:700;
  font-size:12.5px;
}
.rail-add-form button.ghost{
  background:none;color:var(--sidebar-ink-soft);border-color:var(--sidebar-hairline-strong);
}
.tipo-toggle{
  display:flex;
  gap:4px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--sidebar-hairline-strong);
  border-radius:var(--radius-sm);
  padding:3px;
}
.tipo-toggle button{
  flex:1 1 0;
  padding:6px 6px;
  font-size:11.5px;
  font-weight:600;
  border:none;
  border-radius:var(--radius-xs);
  background:none;
  color:var(--sidebar-ink-soft);
}
.tipo-toggle button.active{
  background:var(--gold);
  color:var(--sidebar);
}
.tipo-hint{
  font-size:11px;
  line-height:1.4;
  color:var(--sidebar-ink-faint);
}
.tipo-badge{
  display:inline-block;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--gold-deep);
  background:rgba(138,100,22,0.14);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:2px 9px;
  vertical-align:middle;
}
.client-mgmt-row .tipo-badge{
  justify-self:start;
}

.esp-cards{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:16px 0;
}
.esp-card{
  border:1px solid var(--hairline-strong);
  border-radius:var(--radius-md);
  background:var(--surface-wash);
  padding:14px 16px;
  transition:transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.esp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--hairline-strong);}
.esp-textarea{
  width:100%;
  display:block;
  border:none;
  background:none;
  resize:none;
  overflow:hidden;
  font-family:'Public Sans',sans-serif;
  font-size:14.5px;
  line-height:1.55;
  color:var(--ink);
  padding:0;
  min-height:40px;
}
.esp-textarea:focus{outline:none;}
.esp-textarea::placeholder{color:var(--ink-faint);}
.esp-card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--hairline-strong);
}
.esp-card-foot .valor-wrap{max-width:170px;}

.main{
  flex:1 1 auto;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius-lg);
  padding:26px 26px 24px;
  box-shadow:var(--shadow-card);
}

/* ---------- Client panel ---------- */
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.panel-title{
  font-family:'Fraunces',serif;
  font-size:21px;
  font-weight:600;
}
.panel-head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mini-stats{display:flex;gap:8px;}
.mini-stat{background:var(--surface-wash);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:6px 14px;text-align:center;}
.mini-stat .v{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.mini-stat .l{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.year-switch{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13.5px;
  color:var(--ink-soft);
}
.year-switch button{
  background:rgba(34,30,25,0.05);border:none;
  border-radius:8px;
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.year-switch button:hover{background:rgba(34,30,25,0.09);color:var(--ink);}

.months{
  position:relative;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px;
  margin-bottom:20px;
  background:var(--surface-wash);
  border:1px solid var(--hairline);
  border-radius:var(--radius-pill);
  width:fit-content;
  max-width:100%;
}
.month-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none;
  border-radius:var(--radius-pill); background:var(--sidebar);
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide);
  will-change:transform,width,height; opacity:0;
}
.month-pill{
  position:relative; z-index:1;
  flex:0 0 auto;
  padding:8px 14px;
  font-size:12.5px;
  font-weight:500;
  color:var(--ink-soft);
  background:transparent;
  border:none;
  border-radius:var(--radius-pill);
  white-space:nowrap;
  transition:color var(--dur-base) var(--ease);
}
.month-pill .count{
  font-size:10px;
  color:var(--ink-faint);
  margin-left:5px;
}
.month-pill.active{
  color:var(--sidebar-ink);
}
.month-pill.active .count{color:rgba(242,238,227,.7);}
.month-pill.has-data:not(.active)::after{
  content:"";
  position:absolute;
  top:6px;right:7px;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--accent-soft);
}
.month-pill:hover:not(.active){color:var(--ink);}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--hairline);}
table.ledger{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
}
table.ledger thead th{
  text-align:left;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-faint);
  padding:12px 14px;
  background:rgba(34,30,25,0.03);
  border-bottom:1px solid var(--hairline);
}
table.ledger thead th.num{width:38px;}
table.ledger thead th.data{width:150px;}
table.ledger thead th.valor{width:130px;text-align:right;}
table.ledger thead th.acao{width:40px;}
table.ledger tbody td{
  padding:6px 8px;
  border-bottom:1px solid var(--hairline);
  vertical-align:middle;
  font-size:13.5px;
}
table.ledger tbody tr:last-child td{border-bottom:none;}
table.ledger tbody tr:hover{background:rgba(34,30,25,0.03);}
table.ledger td.num{
  color:var(--ink-faint);
  font-size:12px;
  padding-left:10px;
}
.cell-input{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  padding:7px 7px;
  border-radius:8px;
  color:var(--ink);
}
.cell-input:hover{border-color:var(--hairline-strong);}
.cell-input:focus{
  outline:none;
  border-color:var(--gold);
  background:rgba(34,30,25,0.04);
}
input.cell-input[type="date"]{font-size:12.5px;color-scheme:light;}
input.cell-input.valor{
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.valor-wrap{
  display:flex;
  align-items:center;
  gap:2px;
}
.valor-wrap .valor-prefix{
  font-size:11.5px;
  color:var(--ink-faint);
  flex:0 0 auto;
}
.valor-wrap .cell-input.valor{flex:1 1 auto;}
td.acao{text-align:center;}
.icon-btn{
  background:none;border:none;
  color:var(--ink-faint);
  width:26px;height:26px;
  border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--danger-wash);color:var(--danger);}

/* ---------- Celular: o lancamento deixa de ser linha de tabela ----------
   Uma tabela de 640px num aparelho de 375 obriga a rolar de lado pra
   digitar um valor. Aqui cada linha vira um cartao de tres faixas
   (video / cliente / data + valor) e o scroll horizontal some. O HTML
   continua sendo uma <table> — muda so o display, entao todos os
   handlers e o PDF seguem lendo a mesma estrutura. */
@media (max-width:640px){
  .table-wrap{overflow:visible;border:none;border-radius:0;}
  table.ledger{min-width:0;display:block;}
  table.ledger thead{display:none;}
  table.ledger tbody{display:flex;flex-direction:column;gap:8px;}
  table.ledger tbody tr{
    display:grid;
    /* a terceira coluna carrega o botao de excluir (44px) e o valor, que
       precisa de mais espaco — daí 104px, nao 44. */
    grid-template-columns:26px minmax(0,1fr) 104px;
    grid-template-areas:
      "num video acao"
      "num cliente cliente"
      "num data valor";
    align-items:center;
    gap:2px 6px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:8px 10px 10px 2px;
    box-shadow:var(--shadow-xs);
  }
  table.ledger tbody tr:hover{background:var(--surface-wash);}
  table.ledger tbody td{display:block;padding:0;border-bottom:none;}
  table.ledger tbody td.num{grid-area:num;text-align:center;padding-left:0;}
  table.ledger tbody td.video{grid-area:video;}
  table.ledger tbody td.cliente{grid-area:cliente;}
  table.ledger tbody td.data{grid-area:data;}
  table.ledger tbody td.valor{grid-area:valor;}
  table.ledger tbody td.acao{grid-area:acao;text-align:right;}
  table.ledger tbody td.video .cell-input{font-size:14.5px;font-weight:600;}
  table.ledger tbody td.cliente .cell-input{font-size:13.5px;color:var(--ink-soft);}
  table.ledger tbody td.data .cell-input{font-size:12px;padding-left:7px;}
  table.ledger tbody td.valor .valor-wrap{justify-content:flex-end;}
  table.ledger tbody td.valor .cell-input{font-size:15px;font-weight:600;}
  .table-foot{flex-direction:column;align-items:stretch;gap:10px;}
  .add-row-btn{text-align:center;}
  .action-bar .btn{flex:1 1 100%;text-align:center;}
}
