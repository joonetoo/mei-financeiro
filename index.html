<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Neto Filmes — Controle Financeiro</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#0A0E1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Controle MEI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  /* Neutral, near-black surfaces (evolved from the navy palette toward a
     productivity-dashboard look) + a vivid blue primary accent. */
  --navy-deep:#0A0C12;
  --navy-panel:#12141C;
  --navy-raised:#181B26;
  --slate:#26425A;
  --slate-light:#4A6C89;
  --sky:#3D7EFF;
  --sky-strong:#6B9CFF;
  --accent-wash:rgba(61,126,255,0.14);
  --accent-soft:#86A8CF;
  --accent-soft-strong:#ACC9E4;
  --status-ok:#34C77B;
  --status-ok-wash:rgba(52,199,123,0.14);
  --status-warn:#E3A63E;
  --status-warn-wash:rgba(227,166,62,0.14);
  --cream:#F4F6FA;
  --ink-soft:#9AA4B8;
  --ink-faint:#5C6478;
  --hairline:rgba(255,255,255,0.07);
  --hairline-strong:rgba(255,255,255,0.14);
  --danger:#E5584A;
  --danger-wash:rgba(229,88,74,0.14);
  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.35);
  --shadow-card:0 10px 24px -14px rgba(0,0,0,.55);
  --shadow-hover:0 16px 32px -14px rgba(0,0,0,.6);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:14px; --text-md:15px; --text-lg:17px; --text-xl:21px; --text-2xl:26px; --text-3xl:34px;
  --ease:cubic-bezier(.22,.9,.32,1);
  --ease-slide:cubic-bezier(.66,.01,.24,1.02);
  --dur-fast:150ms; --dur-base:220ms; --dur-slide:440ms; --dur-fill:500ms; --dur-ring:600ms;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--navy-deep);
  background-image:
    radial-gradient(1100px 480px at 12% -10%, rgba(61,126,255,0.10), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(134,168,207,0.07), transparent 55%);
  background-attachment:fixed;
  color:var(--cream);
  font-family:'Manrope',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  #app *, #app *::before, #app *::after{
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}
@keyframes rowFadeUp{from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}
.row-enter{opacity:0;animation:rowFadeUp .4s var(--ease) forwards;}
.row-enter:nth-child(1){animation-delay:.02s;} .row-enter:nth-child(2){animation-delay:.05s;}
.row-enter:nth-child(3){animation-delay:.08s;} .row-enter:nth-child(4){animation-delay:.11s;}
.row-enter:nth-child(5){animation-delay:.14s;} .row-enter:nth-child(6){animation-delay:.17s;}
.row-enter:nth-child(7){animation-delay:.20s;} .row-enter:nth-child(8){animation-delay:.23s;}

/* -------- privacy / sensitive values -------- */
.sensitive{transition:filter .15s ease;}
body.privacy-on .sensitive{filter:blur(7px);user-select:none;}

#app{
  max-width:1180px;
  margin:0 auto;
  padding:20px 20px 64px;
}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:6px 4px 20px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.brand h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:26px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .sub{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--ink-faint);
  margin-top:4px;
}
.savestate{
  font-size:12px;
  color:var(--ink-faint);
  font-family:'JetBrains Mono',monospace;
  white-space:nowrap;
}
.savestate.saving{color:var(--sky);}

.topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.privacy-toggle{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-pill);
  border:1px solid var(--hairline-strong);
  color:var(--ink-soft);font-size:12.5px;font-weight:600;
  background:var(--navy-raised);
  box-shadow:var(--shadow-card);
}
.privacy-toggle:hover{color:var(--cream);}
.privacy-toggle.active{color:var(--sky-strong);border-color:var(--sky);}
.privacy-toggle svg{display:block;flex:0 0 auto;}
.privacy-toggle svg[hidden]{display:none;}

/* ---------- Stats row ---------- */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{
  background:var(--navy-panel);border:1px solid var(--hairline);border-radius:var(--radius-md);
  padding:16px 18px;box-shadow:var(--shadow-card);
  transition:transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
  opacity:0;animation:rowFadeUp .45s var(--ease) forwards;
}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--hairline-strong);}
.stat-card:nth-child(1){animation-delay:.02s;} .stat-card:nth-child(2){animation-delay:.06s;}
.stat-card:nth-child(3){animation-delay:.10s;} .stat-card:nth-child(4){animation-delay:.14s;}
.stat-icon{
  width:30px;height:30px;border-radius:var(--radius-xs);background:var(--accent-wash);color:var(--sky-strong);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;
}
.stat-label{font-size:var(--text-2xs);color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:var(--text-2xl);font-weight:700;margin-top:6px;letter-spacing:-.01em;color:var(--cream);}
.stat-foot{display:flex;align-items:center;gap:8px;margin-top:8px;}
.stat-pill{font-size:var(--text-2xs);font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);}
.stat-pill.ok{background:var(--status-ok-wash);color:var(--status-ok);}
.stat-pill.warn{background:var(--status-warn-wash);color:var(--status-warn);}
.stat-pill.danger{background:var(--danger-wash);color:var(--danger);}

/* ---------- Layout: rail + main ---------- */
.layout{
  display:flex;
  gap:22px;
  align-items:flex-start;
}
.rail{
  flex:0 0 216px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--navy-panel);
  border:1px solid var(--hairline);
  border-radius:var(--radius-lg);
  padding:14px;
  position:sticky;
  top:16px;
}
.rail-group-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--ink-faint);
  padding:8px 10px 4px;
}
.rail-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none; border-radius:var(--radius-pill);
  background:var(--accent-wash); border:1px solid var(--sky);
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide), opacity var(--dur-base) ease;
  will-change:transform,width,height; opacity:0;
}
.tab-btn{
  position:relative; z-index:1;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  background:transparent;
  border:none;
  padding:10px 12px;
  font-size:14px;
  font-weight:500;
  color:var(--ink-soft);
  border-radius:var(--radius-pill);
  transition:color var(--dur-base) var(--ease);
}
.tab-btn:hover:not(.active){color:var(--cream);}
.tab-btn.active{color:var(--cream);font-weight:600;}
.tab-chip{
  width:28px;height:28px;border-radius:9px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11.5px;
  background:rgba(255,255,255,0.08);color:var(--accent-soft);
}
.tab-btn .tab-label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab-btn .tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:inherit;
  opacity:0.85;
  flex:0 0 auto;
}
.chip-0{background:rgba(134,168,207,0.22);color:var(--sky-strong);}
.chip-1{background:rgba(74,108,137,0.35);color:#B9D2E4;}
.chip-2{background:rgba(38,66,90,0.4);color:#AEC6E0;}

.rail-divider{
  height:1px;
  background:var(--hairline);
  margin:8px 6px;
}
.rail-add{
  margin-top:6px;
  padding:9px 14px;
  font-size:13px;
  color:var(--sky-strong);
  background:none;
  border:1px dashed var(--hairline-strong);
  border-radius:var(--radius-pill);
  text-align:left;
}
.rail-add:hover{background:rgba(134,168,207,0.1);}
.rail-add-form{
  margin-top:6px;
  padding:12px;
  background:var(--navy-raised);
  border:1px solid var(--hairline-strong);
  border-radius:var(--radius-md);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.rail-add-form input{
  padding:8px 10px;
  border:1px solid var(--hairline-strong);
  border-radius:var(--radius-md);
  background:rgba(243,236,239,0.04);
  color:var(--cream);
}
.rail-add-form .row{display:flex;gap:6px;}
.rail-add-form > .row > button{
  padding:8px 12px;
  border-radius:var(--radius-pill);
  border:1px solid var(--sky);
  background:var(--sky);
  color:var(--navy-deep);
  font-weight:700;
  font-size:12.5px;
}
.rail-add-form button.ghost{
  background:none;color:var(--ink-soft);border-color:var(--hairline-strong);
}
.tipo-toggle{
  display:flex;
  gap:4px;
  background:rgba(243,236,239,0.04);
  border:1px solid var(--hairline-strong);
  border-radius:var(--radius-pill);
  padding:3px;
}
.tipo-toggle button{
  flex:1 1 0;
  padding:6px 6px;
  font-size:11.5px;
  font-weight:600;
  border:none;
  border-radius:var(--radius-pill);
  background:none;
  color:var(--ink-soft);
}
.tipo-toggle button.active{
  background:var(--sky);
  color:var(--navy-deep);
}
.tipo-hint{
  font-size:11px;
  line-height:1.4;
  color:var(--ink-faint);
}
.tipo-badge{
  display:inline-block;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--sky-strong);
  background:rgba(134,168,207,0.14);
  border:1px solid var(--sky);
  border-radius:20px;
  padding:2px 9px;
  vertical-align:middle;
}
.client-mgmt-row .tipo-badge{
  justify-self:start;
}

.esp-cards{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:16px 0;
}
.esp-card{
  border:1px solid var(--hairline-strong);
  border-radius:var(--radius-md);
  background:rgba(255,255,255,0.03);
  padding:14px 16px;
  transition:transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.esp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--hairline-strong);}
.esp-textarea{
  width:100%;
  display:block;
  border:none;
  background:none;
  resize:none;
  overflow:hidden;
  font-family:'Manrope',sans-serif;
  font-size:14.5px;
  line-height:1.55;
  color:var(--cream);
  padding:0;
  min-height:40px;
}
.esp-textarea:focus{outline:none;}
.esp-textarea::placeholder{color:var(--ink-faint);}
.esp-card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--hairline-strong);
}
.esp-card-foot .valor-wrap{max-width:170px;}

.main{
  flex:1 1 auto;
  min-width:0;
  background:var(--navy-panel);
  border:1px solid var(--hairline);
  border-radius:var(--radius-lg);
  padding:26px 26px 24px;
  box-shadow:var(--shadow-card);
}

/* ---------- Client panel ---------- */
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.panel-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:21px;
  font-weight:600;
}
.panel-head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mini-stats{display:flex;gap:8px;}
.mini-stat{background:var(--navy-raised);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:6px 14px;text-align:center;}
.mini-stat .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--cream);}
.mini-stat .l{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.year-switch{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:13.5px;
  color:var(--ink-soft);
}
.year-switch button{
  background:rgba(243,236,239,0.05);border:none;
  border-radius:8px;
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.year-switch button:hover{background:rgba(243,236,239,0.1);color:var(--cream);}

.months{
  position:relative;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px;
  margin-bottom:20px;
  background:var(--navy-raised);
  border:1px solid var(--hairline);
  border-radius:var(--radius-pill);
  width:fit-content;
  max-width:100%;
}
.month-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none;
  border-radius:var(--radius-pill); background:var(--sky);
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide);
  will-change:transform,width,height; opacity:0;
}
.month-pill{
  position:relative; z-index:1;
  flex:0 0 auto;
  padding:8px 14px;
  font-size:12.5px;
  font-weight:500;
  color:var(--ink-soft);
  background:transparent;
  border:none;
  border-radius:var(--radius-pill);
  white-space:nowrap;
  transition:color var(--dur-base) var(--ease);
}
.month-pill .count{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--ink-faint);
  margin-left:5px;
}
.month-pill.active{
  color:var(--navy-deep);
}
.month-pill.active .count{color:rgba(10,12,18,.6);}
.month-pill.has-data:not(.active)::after{
  content:"";
  position:absolute;
  top:6px;right:7px;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--accent-soft);
}
.month-pill:hover:not(.active){color:var(--cream);}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--hairline);}
table.ledger{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
}
table.ledger thead th{
  text-align:left;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-faint);
  padding:12px 14px;
  background:rgba(243,236,239,0.03);
  border-bottom:1px solid var(--hairline);
}
table.ledger thead th.num{width:38px;}
table.ledger thead th.data{width:150px;}
table.ledger thead th.valor{width:130px;text-align:right;}
table.ledger thead th.acao{width:40px;}
table.ledger tbody td{
  padding:6px 8px;
  border-bottom:1px solid var(--hairline);
  vertical-align:middle;
  font-size:13.5px;
}
table.ledger tbody tr:last-child td{border-bottom:none;}
table.ledger tbody tr:hover{background:rgba(243,236,239,0.025);}
table.ledger td.num{
  font-family:'JetBrains Mono',monospace;
  color:var(--ink-faint);
  font-size:12px;
  padding-left:10px;
}
.cell-input{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  padding:7px 7px;
  border-radius:8px;
  color:var(--cream);
}
.cell-input:hover{border-color:var(--hairline-strong);}
.cell-input:focus{
  outline:none;
  border-color:var(--sky);
  background:rgba(243,236,239,0.05);
}
input.cell-input[type="date"]{font-family:'JetBrains Mono',monospace;font-size:12.5px;color-scheme:dark;}
input.cell-input.valor{
  text-align:right;
  font-family:'JetBrains Mono',monospace;
}
.valor-wrap{
  display:flex;
  align-items:center;
  gap:2px;
}
.valor-wrap .valor-prefix{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--ink-faint);
  flex:0 0 auto;
}
.valor-wrap .cell-input.valor{flex:1 1 auto;}
td.acao{text-align:center;}
.icon-btn{
  background:none;border:none;
  color:var(--ink-faint);
  width:26px;height:26px;
  border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--danger-wash);color:var(--danger);}
.icon-btn{transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);}
.icon-btn:active{transform:scale(.85);}

.table-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:16px;
  flex-wrap:wrap;
  gap:12px;
}
.add-row-btn{
  background:none;
  border:1px dashed var(--hairline-strong);
  color:var(--sky-strong);
  padding:9px 16px;
  border-radius:var(--radius-pill);
  font-size:13px;
  font-weight:600;
}
.add-row-btn:hover{background:rgba(134,168,207,0.1);}
.month-total{
  font-size:13.5px;
  color:var(--ink-soft);
}
.month-total b{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--cream);font-weight:600;}

.action-bar{
  display:flex;
  gap:10px;
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--hairline);
  flex-wrap:wrap;
}
.btn{
  padding:11px 18px;
  border-radius:var(--radius-pill);
  font-size:13.5px;
  font-weight:600;
  border:1px solid var(--hairline-strong);
  background:transparent;
  color:var(--cream);
  transition:transform var(--dur-fast) var(--ease), background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.btn:hover{background:rgba(255,255,255,0.05);}
.btn:active:not(:disabled){transform:scale(.97);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn.primary{
  background:var(--sky);
  border-color:var(--sky);
  color:#fff;
  box-shadow:0 8px 20px -10px rgba(61,126,255,.7);
}
.btn.primary:hover{background:var(--sky-strong);}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn.danger-step{border-color:var(--danger);color:var(--danger);}
.btn.danger-step.confirming{background:var(--danger);color:#fff;}

.empty-hint{
  color:var(--ink-faint);
  font-size:13px;
  padding:22px 4px;
  text-align:center;
  border:1px dashed var(--hairline);
  border-radius:var(--radius-md);
  margin-bottom:14px;
