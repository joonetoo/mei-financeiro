<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritmo</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#E8E1D0">
<script>
/* tema (Claro / Escuro / Automatico) antes de desenhar a pagina: so aparencia, fica no aparelho */
(function(){try{var t=localStorage.getItem('ritmo-tema')||'auto';var e=t==='escuro'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);if(e){document.documentElement.classList.add('escuro');var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#171B14';}}catch(x){}})();
</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  /* "Extrato claro" — fundo creme + barra lateral escura, acentos foscos
     (verde-oliva, dourado, lavanda) no lugar do azul neon com brilho. */
  --bg:#F2EEE3;
  --surface:#FFFFFF;
  --surface-wash:#F8F5EE;

  --sidebar:#211D18;
  --sidebar-raised:#2B2418;
  --sidebar-active:#3A2F1C;
  --sidebar-active-ink:#F1DFB8;
  --sidebar-ink:#F2EEE3;
  --sidebar-ink-soft:#B9B2A6;
  --sidebar-ink-faint:#8B8272;
  --sidebar-hairline:rgba(255,255,255,0.08);
  --sidebar-hairline-strong:rgba(255,255,255,0.18);

  --ink:#211D18;
  --ink-soft:#5A5344;
  --ink-faint:#6E675C;
  --hairline:rgba(34,30,25,0.09);
  --hairline-strong:rgba(34,30,25,0.18);

  --sage:#5F7248;
  --sage-wash:#DCE3CD;
  --sage-deep:#3E4A2E;

  --gold:#8A6416;
  --gold-wash:#F3E1B8;
  --gold-deep:#5B430E;

  --lavender:#4A4C81;
  --lavender-wash:#E2E1F0;
  --lavender-deep:#33355C;

  /* nomes mantidos porque src/main.js os referencia diretamente (gauge SVG) */
  --slate:#5F7248;
  --accent-soft:#C99A44;
  --accent-wash:rgba(138,100,22,0.12);

  --status-ok:#3E4A2E;
  --status-ok-wash:#DCE3CD;
  --status-warn:#5B430E;
  --status-warn-wash:#F3E1B8;
  --danger:#A6402E;
  --danger-wash:rgba(166,64,46,0.12);

  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(34,30,25,.10);
  --shadow-card:0 10px 24px -16px rgba(34,30,25,.20);
  --shadow-hover:0 16px 32px -18px rgba(34,30,25,.26);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:14px; --text-md:15px; --text-lg:17px; --text-xl:21px; --text-2xl:26px; --text-3xl:34px;
  --ease:cubic-bezier(.22,.9,.32,1);
  --ease-slide:cubic-bezier(.66,.01,.24,1.02);
  --dur-fast:150ms; --dur-base:220ms; --dur-slide:440ms; --dur-fill:500ms; --dur-ring:600ms;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  #app *, #app *::before, #app *::after{
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}
@keyframes rowFadeUp{from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}
.row-enter{opacity:0;animation:rowFadeUp .4s var(--ease) forwards;}
.row-enter:nth-child(1){animation-delay:.02s;} .row-enter:nth-child(2){animation-delay:.05s;}
.row-enter:nth-child(3){animation-delay:.08s;} .row-enter:nth-child(4){animation-delay:.11s;}
.row-enter:nth-child(5){animation-delay:.14s;} .row-enter:nth-child(6){animation-delay:.17s;}
.row-enter:nth-child(7){animation-delay:.20s;} .row-enter:nth-child(8){animation-delay:.23s;}

/* -------- privacy / sensitive values --------
   Bolinhas em vez de desfoque, como em app de banco — cada caractere vira um
   ponto (o valor real continua ali, so o desenho do texto muda). */
body.privacy-on .sensitive{-webkit-text-security:disc;user-select:none;}

#app{
  max-width:1180px;
  margin:0 auto;
  padding:20px 20px 64px;
}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:14px 18px;
  padding:4px 2px 18px;
  flex-wrap:wrap;
}
.brand{flex:1 1 auto;min-width:0;}
.brand h1{
  font-family:'Manrope',system-ui,sans-serif;
  font-weight:600;
  font-size:26px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .sub{
  font-size:12px;
  color:var(--ink-faint);
  margin-top:2px;
}
.savestate{
  font-size:12px;
  color:var(--ink-faint);
  white-space:nowrap;
}
.savestate.saving{color:var(--gold-deep);}
.savestate.error{color:var(--danger);font-weight:600;white-space:normal;}

.topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.privacy-toggle{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--hairline-strong);
  color:var(--ink-soft);font-size:12.5px;font-weight:600;
  background:var(--surface);
}
.privacy-toggle:hover{color:var(--ink);}
.privacy-toggle.active{color:var(--gold-deep);border-color:var(--gold);}
.privacy-toggle svg{display:block;flex:0 0 auto;}
.privacy-toggle svg[hidden]{display:none;}

/* ---------- Troca de tela: Painel / Lançamentos ---------- */
.screen-nav{
  position:relative;display:inline-flex;gap:4px;padding:4px;
  background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);
  box-shadow:var(--shadow-card);
}
.screen-nav-pill{
  position:absolute;top:0;left:0;z-index:0;pointer-events:none;
  border-radius:var(--radius-pill);background:var(--ink);opacity:0;
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide);
  will-change:transform,width,height;
}
.screen-nav button{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;
  border:0;background:transparent;padding:9px 16px;border-radius:var(--radius-pill);
  font-size:13px;font-weight:700;color:var(--ink-soft);
  transition:color .25s var(--ease);
}
.screen-nav button.active{color:var(--bg);}
.screen-nav button:not(.active):hover{color:var(--ink);}
.screen-nav button svg{flex:0 0 auto;}
@keyframes screenIn{from{opacity:.4;transform:translateY(4px);} to{opacity:1;transform:none;}}
.screen-in{animation:screenIn .35s var(--ease);}

/* ---------- Painel ----------
   Tela so de leitura: limite, meta do mes, hoje, semana, graficos. Tudo
   escopado em .dash pra nao esbarrar nas classes da tela de Lancamentos. */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;}
.dash .s3{grid-column:span 3;} .dash .s4{grid-column:span 4;} .dash .s5{grid-column:span 5;}
.dash .s6{grid-column:span 6;} .dash .s7{grid-column:span 7;} .dash .s8{grid-column:span 8;}
.dash .s12{grid-column:span 12;}
.dash .card{
  position:relative;border-radius:20px;box-shadow:var(--shadow-card);padding:20px 22px;
  display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--hairline);min-width:0;
}
.dash .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.dash .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.dash .new{display:inline-block;margin-left:6px;vertical-align:1px;background:#1F5FBF;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:999px;}
.dash .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.dash .pill.ok{background:var(--status-ok-wash);color:var(--status-ok);}
.dash .pill.warn{background:var(--status-warn-wash);color:var(--status-warn);border:1px solid rgba(91,67,14,.25);}
.dash .pill.danger{background:var(--danger-wash);color:var(--danger);}
.dash .pill.done{background:var(--sage);color:#fff;}
.dash .big{font-family:'Manrope',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:30px;}
.dash .msg{font-size:13.5px;color:var(--ink-soft);margin:0;}
.dash .msg b{font-weight:600;color:var(--ink);}
.dash .sub{font-size:12.5px;color:var(--ink-soft);margin:0;}
.dash .sub b{color:var(--ink);font-weight:600;}
.dash .bar{position:relative;height:10px;border-radius:6px;}
.dash .bar .fill{height:10px;border-radius:6px;transition:width .6s var(--ease);}
.dash .bar .pace{position:absolute;top:-5px;width:2px;height:20px;border-radius:1px;background:var(--status-warn);}
.dash .foot{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--ink-soft);}
.dash .foot .pace-t{color:var(--status-warn);}

.dash .card-hero{background:var(--sage-wash);border-color:rgba(95,114,72,.35);}
.dash .card-hero .label{color:var(--sage-deep);}
.dash .card-hero .big{font-size:42px;color:var(--sage-deep);}
.dash .card-hero .bar{background:rgba(46,56,33,.16);}
.dash .card-hero .fill{background:var(--sage);}
.dash .card-hero .fill.warn{background:var(--status-warn);}
.dash .card-hero .fill.danger{background:var(--danger);}
.dash .card-hero .msg b{color:var(--sage-deep);}

.dash .card-meta{background:var(--gold-wash);border-color:rgba(138,100,22,.25);}
.dash .card-meta .label{color:var(--gold-deep);}
.dash .card-meta .big{color:var(--gold-deep);}
.dash .card-meta .of{font-size:13px;color:var(--gold-deep);font-weight:600;white-space:nowrap;}
.dash .vrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.dash .card-meta .bar{background:rgba(91,67,14,.16);}
.dash .card-meta .fill{background:var(--gold);}
.dash .card-meta .msg b{color:var(--gold-deep);}
.dash .head-r{display:inline-flex;align-items:center;gap:6px;}
.dash .edit-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(91,67,14,.3);background:rgba(255,255,255,.55);color:var(--gold-deep);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;}
.dash .edit-btn:hover{background:#fff;}
.dash .meta-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dash .meta-form label{font-size:12px;color:var(--gold-deep);font-weight:600;width:100%;}
.dash .money-in{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:8px 12px;flex:1 1 140px;}
.dash .money-in span{color:var(--ink-faint);font-weight:600;}
.dash .money-in input{border:0;outline:0;font-size:16px;font-weight:600;width:100%;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;}
.dash .btn-dark{border:0;background:var(--gold-deep);color:var(--gold-wash);border-radius:999px;padding:9px 16px;font-weight:700;}
.dash .btn-line{border:1px solid var(--hairline-strong);background:transparent;color:var(--ink-soft);border-radius:999px;padding:8px 14px;font-weight:600;}
.dash button:focus-visible,.dash input:focus-visible,.screen-nav button:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px;}

.dash .card-year{background:var(--lavender-wash);border-color:rgba(74,76,129,.2);justify-content:space-between;}
.dash .card-year .label{color:var(--lavender-deep);}
.dash .card-year .big{font-size:28px;color:var(--lavender-deep);}
.dash .card-year .sub{color:var(--lavender-deep);}
.dash .card-year .msg{font-size:12.5px;color:var(--lavender-deep);}
.dash .card-year .msg b{color:var(--lavender-deep);}
.dash .card-year .msg .sensitive{white-space:nowrap;}
.dash .card-year .cmp{display:flex;flex-direction:column;gap:8px;}
.dash .card-year .cmp .row{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:11.5px;color:var(--lavender-deep);font-weight:600;}
.dash .card-year .cmp .track{height:10px;border-radius:6px;background:rgba(74,76,129,.14);overflow:hidden;}
.dash .card-year .cmp .track i{display:block;height:100%;border-radius:6px;background:rgba(74,76,129,.4);transition:width .6s var(--ease);}
.dash .card-year .cmp .track i.cur{background:var(--lavender);}
.dash .card-year .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--lavender-deep);}
.dash .card-year .kv b{font-weight:700;}

.dash .quick{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:auto;border:1px solid var(--hairline-strong);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;transition:background .2s var(--ease),transform .15s var(--ease);}
.dash .quick:hover{background:var(--sage-wash);}
.dash .quick:active{transform:scale(.97);}

.dash .card-week{flex-direction:row;align-items:stretch;gap:22px;}
.dash .card-week .left{display:flex;flex-direction:column;gap:10px;flex:0 0 200px;}
.dash .wbars{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;min-height:120px;}
.dash .wb{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.dash .wb .v{font-size:10.5px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.dash .wb .col{width:100%;max-width:40px;border-radius:7px 7px 3px 3px;background:var(--sage-wash);}
.dash .wb.today .col{background:var(--sage);}
.dash .wb.today .v,.dash .wb.today .d{color:var(--sage-deep);}
.dash .wb.future .col{background:transparent;border:1.5px dashed var(--hairline-strong);height:16px;}
.dash .wb .d{font-size:11px;color:var(--ink-faint);font-weight:600;}

/* grafico dia a dia */
.dash .chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;}
.dash .yaxis{display:flex;flex-direction:column;justify-content:space-between;height:150px;font-size:10px;color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;transform:translateY(-6px);}
.dash .plot{position:relative;height:150px;border-bottom:1px solid var(--hairline-strong);}
.dash .grid-l{position:absolute;left:0;right:0;border-top:1px dashed var(--hairline);}
.dash .avg{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none;}
.dash .avg span{position:absolute;right:0;top:-20px;font-size:10.5px;font-weight:700;color:var(--gold-deep);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap;}
.dash .days{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--dias,30),minmax(0,1fr));gap:3px;align-items:end;}
.dash .dcol{height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px;}
.dash .dcol.we{background:rgba(34,30,25,.035);}
.dash .dcol i{display:block;width:100%;max-width:18px;border-radius:4px 4px 1px 1px;background:var(--sage);opacity:.85;transition:opacity .15s;}
.dash .dcol:hover i{opacity:1;}
.dash .dcol.today i{background:var(--sage-deep);opacity:1;}
.dash .dcol.future i{background:transparent;border:1.5px dashed var(--hairline-strong);height:10px;}
.dash .xaxis{grid-column:2;display:grid;grid-template-columns:repeat(var(--dias,30),minmax(0,1fr));gap:3px;font-size:10px;color:var(--ink-faint);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums;}
.dash .xaxis span{white-space:nowrap;}
.dash .xaxis .t{color:var(--sage-deep);font-weight:700;}
.dash .stats3{display:flex;gap:10px 22px;flex-wrap:wrap;}
.dash .stats3 div{display:flex;flex-direction:column;}
.dash .stats3 b{font-family:'Manrope',system-ui,sans-serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.dash .stats3 span{font-size:11.5px;color:var(--ink-soft);}

/* semana a semana (total de cada semana do mes, com troca de mes) */
.dash .msw{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--hairline-strong);border-radius:999px;padding:3px;}
.dash .msw button{width:32px;height:32px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-xs);padding:0;transition:transform .15s var(--ease);}
.dash .msw button:active:not(:disabled){transform:scale(.92);}
.dash .msw button:disabled{background:transparent;box-shadow:none;color:var(--hairline-strong);cursor:default;}
.dash .msw span{font-size:13px;font-weight:700;min-width:118px;text-align:center;}
.dash .weeks{position:absolute;inset:0;display:grid;gap:14px;align-items:end;padding:0 6px;}
.dash .wk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0;}
.dash .wk .v{font-size:11.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.dash .wk i{display:block;width:100%;max-width:64px;border-radius:7px 7px 2px 2px;background:var(--sage);opacity:.85;transition:height .6s var(--ease);}
.dash .wk.now i{background:var(--sage-deep);opacity:1;}
.dash .wk.now .v{color:var(--sage-deep);}
.dash .wk.fut i{background:transparent;border:1.5px dashed var(--hairline-strong);height:12px;box-sizing:border-box;}
.dash .wk.zero i{height:3px;background:var(--hairline-strong);opacity:1;}
.dash .wxaxis{grid-column:2;display:grid;gap:14px;padding:0 6px;margin-top:6px;text-align:center;}
.dash .wxaxis div{display:flex;flex-direction:column;gap:1px;min-width:0;}
.dash .wxaxis b{font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.dash .wxaxis span{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .wxaxis .t b,.dash .wxaxis .t span{color:var(--sage-deep);}
.dash .card-semanas .weeks{z-index:1;}
.dash .wk .v{background:var(--surface);padding:0 3px;border-radius:4px;}
.dash .avg-key{display:inline-block;width:16px;border-top:2px dashed var(--gold);vertical-align:3px;margin-right:6px;}
.dash .wempty{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--surface-wash);border:1px solid var(--hairline);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap;}

/* por cliente */
.dash .clients{display:flex;flex-direction:column;gap:14px;}
.dash .cl{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;}
.dash .chip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;grid-row:span 2;}
.dash .chip.chip-0{background:var(--gold-wash);color:var(--gold-deep);}
.dash .chip.chip-1{background:var(--lavender-wash);color:var(--lavender-deep);}
.dash .chip.chip-2{background:var(--sage-wash);color:var(--sage-deep);}
.dash .stack i.chip-0,.dash .track i.chip-0{background:var(--gold);}
.dash .stack i.chip-1,.dash .track i.chip-1{background:var(--lavender);}
.dash .stack i.chip-2,.dash .track i.chip-2{background:var(--sage);}
.dash .cl .n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .cl .v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;text-align:right;}
.dash .cl .track{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;}
.dash .cl .track i{display:block;height:100%;border-radius:5px;}
.dash .cl .meta-l{font-size:11.5px;color:var(--ink-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.dash .stack{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;}

/* notas por mes */
.dash .mchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;}
.dash .mplot{position:relative;height:170px;border-bottom:1px solid var(--hairline-strong);}
.dash .mcols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;}
.dash .mcol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
.dash .mcol i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:#B9BADB;}
.dash .mcol.cur i{background:var(--lavender);}
.dash .mcol.future i{background:transparent;border:1.5px dashed var(--hairline-strong);height:10px;}
.dash .mcol.zero i{height:2px;background:var(--hairline-strong);}
.dash .ref{position:absolute;left:0;right:0;border-top:2px dashed var(--sage);pointer-events:none;}
.dash .ref span{position:absolute;right:0;top:-20px;font-size:10.5px;font-weight:700;color:var(--sage-deep);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap;}
.dash .mx{grid-column:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:4px;}
.dash .mx .t{color:var(--lavender-deep);font-weight:700;}

/* ultimos videos */
.dash .recent{display:flex;flex-direction:column;}
.dash .rv{display:grid;grid-template-columns:34px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-top:1px solid var(--hairline);}
.dash .rv:first-child{border-top:0;padding-top:0;}
.dash .rv .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .rv .s{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .rv .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;grid-row:span 2;}


/* A cobrar: um cartao por cliente com o periodo de cobranca aberto */
.dash .sec-head{grid-column:span 12;display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-top:4px;}
.dash .sec-head h2{margin:0;font-family:'Manrope',system-ui,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em;}
.dash .cob-row{grid-column:span 12;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.dash .cob{text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s var(--ease);}
.dash .cob:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.dash .cob:active{transform:scale(.985);}
.dash .cob .top{display:flex;align-items:center;gap:10px;}
.dash .cob .chip{grid-row:auto;flex:0 0 auto;}
.dash .cob .nm{font-weight:700;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .cob .per{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.dash .cob .close-l{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--hairline-strong);padding-top:10px;}
.dash .cob .close-l b{color:var(--ink);}
.dash .pill.soon{background:var(--gold-wash);color:var(--gold-deep);}
.dash .pill.late{background:var(--danger-wash);color:var(--danger);}
.dash .pill.fresh{background:var(--sage-wash);color:var(--sage-deep);}

/* ---------- Periodo de cobranca na aba do cliente ---------- */
.month-pill.closed:not(.active){background:var(--sage-wash);color:var(--sage-deep);}
.month-pill.closed::before{content:"✓ ";font-weight:800;}
.month-pill.open-p:not(.active){box-shadow:inset 0 0 0 1.5px var(--gold);}
.periodo-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin:-8px 0 16px;}
.tagp{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
.tagp.aberto{background:var(--gold-wash);color:var(--gold-deep);}
.periodo-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sage-wash);color:var(--sage-deep);border-radius:var(--radius-md);padding:12px 14px;font-size:13px;margin:-6px 0 16px;}
.periodo-banner b{color:var(--sage-deep);}
.periodo-banner .warn-t{display:block;margin-top:4px;color:var(--danger);}
.periodo-banner .warn-t .sensitive{color:inherit;}
.periodo-banner button{border:1px solid rgba(62,74,46,.35);background:rgba(255,255,255,.6);color:var(--sage-deep);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;}
.periodo-banner button:hover{background:#fff;}
.btn.gold{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--gold-wash);font-weight:700;}
.btn.gold:hover{background:#4A360B;}

/* janela de fechar periodo: card de vidro no Mac, tela cheia no celular */
.fj-veu{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(33,29,24,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fj-fade .25s ease both;}
.fj-janela{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px;
  background:rgba(251,248,241,.86);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 30px 70px rgba(33,29,24,.28);animation:fj-sobe .35s cubic-bezier(.3,.9,.3,1) both;}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.fj-janela{background:var(--surface);}}
.fj-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.fj-topo h2{margin:0;font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--ink);}
.fj-x{border:0;background:rgba(33,29,24,.08);width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink);flex:0 0 auto;}
.fj-cli{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.fj-nome{font-weight:700;color:var(--ink);}
.fj-faixa{font:700 12px 'Manrope',sans-serif;padding:3px 10px;border-radius:99px;background:var(--gold-wash);color:var(--gold-deep);}
.fj-rot{font:700 11px 'Manrope',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px;}
.fj-campo{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line, rgba(33,29,24,.14));border-radius:12px;padding:9px 10px 9px 12px;}
.fj-v{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;font-weight:600;}
.fj-k{font-size:11px;font-weight:500;color:var(--ink-faint);}
.fj-copiar{border:0;background:#E3EAD4;color:#2f3d1f;font:700 12px 'Manrope',sans-serif;padding:8px 12px;border-radius:9px;cursor:pointer;flex:0 0 auto;min-height:36px;}
.fj-copiar.ok{background:#5F7248;color:#fff;}
.fj-vazio{background:var(--gold-wash);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--gold-deep);}
.fj-link{border:0;background:none;padding:0;font:700 13px 'Manrope',sans-serif;color:var(--gold-deep);text-decoration:underline;cursor:pointer;}
.fj-receita{text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;}
.fj-dica{font-size:12px;color:var(--ink-faint);text-align:center;}
.fj-ok{display:flex;flex-direction:column;gap:2px;background:#E3EAD4;color:#2f3d1f;border-radius:14px;padding:12px 14px;font-size:13px;}
.fj-janela .btn{min-height:46px;justify-content:center;}
.fj-x:focus-visible,.fj-copiar:focus-visible,.fj-link:focus-visible,.fj-receita:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px;}
@keyframes fj-fade{from{opacity:0}to{opacity:1}}
@keyframes fj-sobe{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:820px){
  .fj-veu{padding:0;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;align-items:stretch;}
  .fj-janela{width:100%;max-height:none;height:100%;border-radius:0;border:0;box-shadow:none;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));animation:none;}
}
@media (prefers-reduced-motion:reduce){.fj-veu,.fj-janela{animation:none}}
.cnpj-in{margin-left:auto;flex:0 1 210px;min-width:0;font:600 14px 'Manrope',sans-serif;border:1px solid rgba(33,29,24,.18);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);}
.confirm-fechar{flex:1 1 100%;border:1.5px solid var(--gold);background:#FFFBF1;border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.confirm-fechar .cf-title{font-family:'Manrope',system-ui,sans-serif;font-size:17px;font-weight:700;}
.confirm-fechar ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft);}
.confirm-fechar b{color:var(--ink);}
.confirm-fechar .cf-actions{display:flex;gap:10px;flex-wrap:wrap;}
.client-mgmt-row.fecha-row{grid-template-columns:36px 1fr auto;}
.fecha-nome{font-weight:600;font-size:13.5px;}
.fecha-row select{padding:9px 10px;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);background:var(--surface-wash);color:var(--ink);font-size:13px;max-width:220px;}

/* ---------- Layout: rail + main ---------- */
.layout{
  display:flex;
  gap:22px;
  align-items:flex-start;
}
.rail{
  flex:0 0 232px;
  display:flex;
  flex-direction:column;
  gap:3px;
  background:var(--sidebar);
  border-radius:var(--radius-lg);
  padding:14px 10px;
  position:sticky;
  top:16px;
}
/* barra lateral igual a previa aprovada: nomes claros em negrito, sem valor
   ao lado, e a aba aberta com fundo creme (a pilula desliza entre as abas) */
.rail-group-label{
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:rgba(237,231,218,.5);
  padding:6px 10px 4px;
}
.rail-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none; border-radius:var(--radius-sm);
  background:#EDE7DA;
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide), opacity var(--dur-base) ease;
  will-change:transform,width,height; opacity:0;
}
.tab-btn{
  position:relative; z-index:1;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  background:transparent;
  border:none;
  padding:8px 10px;
  font-size:12.5px;
  font-weight:600;
  color:#EDE7DA;
  border-radius:var(--radius-sm);
  transition:color var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
}
.tab-btn:hover:not(.active){background:rgba(237,231,218,.07);}
.tab-btn.active{color:var(--ink);}
.tab-chip{
  width:28px;height:28px;border-radius:9px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;
  background:rgba(237,231,218,.1);color:#EDE7DA;
  transition:background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.tab-btn.active .tab-chip{background:var(--bg);color:var(--ink);}
.tab-btn .tab-label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* cores dos clientes na mesma ordem da previa aprovada (1a aba dourado,
   2a lavanda, 3a verde) — o Painel usa as mesmas (.dash .chip) */
.tab-chip.chip-0{background:rgba(138,100,22,0.32);color:#E7C077;}
.tab-chip.chip-1{background:rgba(74,76,129,0.34);color:#BCBEE4;}
.tab-chip.chip-2{background:rgba(95,114,72,0.28);color:#BFD0A6;}
.tab-btn.active .tab-chip.chip-0{background:var(--gold-wash);color:var(--gold-deep);}
.tab-btn.active .tab-chip.chip-1{background:var(--lavender-wash);color:var(--lavender-deep);}
.tab-btn.active .tab-chip.chip-2{background:var(--sage-wash);color:var(--sage-deep);}
.client-avatar.chip-0{background:var(--gold-wash);color:var(--gold-deep);}
.client-avatar.chip-1{background:var(--lavender-wash);color:var(--lavender-deep);}
.client-avatar.chip-2{background:var(--sage-wash);color:var(--sage-deep);}

.rail-divider{
  height:1px;
  background:rgba(237,231,218,.12);
  margin:8px 6px;
}
.rail-add{
  margin-top:6px;
  padding:9px;
  font-size:12.5px;
  font-weight:600;
  color:rgba(237,231,218,.8);
  background:none;
  border:1px dashed rgba(237,231,218,.28);
  border-radius:var(--radius-sm);
  text-align:center;
}
.rail-add:hover{background:rgba(237,231,218,.07);}
.rail-add-form{
  margin-top:6px;
  padding:12px;
  background:var(--sidebar-raised);
  border:1px solid var(--sidebar-hairline-strong);
  border-radius:var(--radius-md);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.rail-add-form input{
  padding:8px 10px;
  border:1px solid var(--sidebar-hairline-strong);
  border-radius:var(--radius-md);
  background:rgba(255,255,255,0.05);
  color:var(--sidebar-ink);
}
.rail-add-form .row{display:flex;gap:6px;}
.rail-add-form > .row > button{
  padding:8px 12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--sidebar);
  font-weight:700;
  font-size:12.5px;
}
.rail-add-form button.ghost{
  background:none;color:var(--sidebar-ink-soft);border-color:var(--sidebar-hairline-strong);
}
.tipo-toggle{
  display:flex;
  gap:4px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--sidebar-hairline-strong);
  border-radius:var(--radius-sm);
  padding:3px;
}
.tipo-toggle button{
  flex:1 1 0;
  padding:6px 6px;
  font-size:11.5px;
  font-weight:600;
  border:none;
  border-radius:var(--radius-xs);
  background:none;
  color:var(--sidebar-ink-soft);
}
.tipo-toggle button.active{
  background:var(--gold);
  color:var(--sidebar);
}
.tipo-hint{
  font-size:11px;
  line-height:1.4;
  color:var(--sidebar-ink-faint);
}
.tipo-badge{
  display:inline-block;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--gold-deep);
  background:rgba(138,100,22,0.14);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:2px 9px;
  vertical-align:middle;
}
.client-mgmt-row .tipo-badge{
  justify-self:start;
}

.esp-cards{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:16px 0;
}
.esp-card{
  border:1px solid var(--hairline-strong);
  border-radius:var(--radius-md);
  background:var(--surface-wash);
  padding:14px 16px;
  transition:transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.esp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--hairline-strong);}
.esp-textarea{
  width:100%;
  display:block;
  border:none;
  background:none;
  resize:none;
  overflow:hidden;
  font-family:'Manrope',sans-serif;
  font-size:14.5px;
  line-height:1.55;
  color:var(--ink);
  padding:0;
  min-height:40px;
}
.esp-textarea:focus{outline:none;}
.esp-textarea::placeholder{color:var(--ink-faint);}
.esp-card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--hairline-strong);
}
.esp-card-foot .valor-wrap{max-width:170px;}

.main{
  flex:1 1 auto;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius-lg);
  padding:26px 26px 24px;
  box-shadow:var(--shadow-card);
}

/* ---------- Client panel ---------- */
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.panel-title{
  font-family:'Manrope',system-ui,sans-serif;
  font-size:21px;
  font-weight:800;
  letter-spacing:-.02em;
}
.panel-head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mini-stats{display:flex;gap:8px;}
.mini-stat{background:var(--surface-wash);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:6px 14px;text-align:center;}
.mini-stat .v{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.mini-stat .l{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.year-switch{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13.5px;
  color:var(--ink-soft);
}
.year-switch button{
  background:rgba(34,30,25,0.05);border:none;
  border-radius:8px;
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.year-switch button:hover{background:rgba(34,30,25,0.09);color:var(--ink);}

.months{
  position:relative;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px;
  margin-bottom:20px;
  background:var(--surface-wash);
  border:1px solid var(--hairline);
  border-radius:var(--radius-pill);
  width:fit-content;
  max-width:100%;
}
.month-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none;
  border-radius:var(--radius-pill); background:var(--sidebar);
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide);
  will-change:transform,width,height; opacity:0;
}
.month-pill{
  position:relative; z-index:1;
  flex:0 0 auto;
  padding:8px 14px;
  font-size:12.5px;
  font-weight:500;
  color:var(--ink-soft);
  background:transparent;
  border:none;
  border-radius:var(--radius-pill);
  white-space:nowrap;
  transition:color var(--dur-base) var(--ease);
}
.month-pill .count{
  font-size:10px;
  color:var(--ink-faint);
  margin-left:5px;
}
.month-pill.active{
  color:var(--sidebar-ink);
}
.month-pill.active .count{color:rgba(242,238,227,.7);}
.month-pill.has-data:not(.active)::after{
  content:"";
  position:absolute;
  top:6px;right:7px;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--accent-soft);
}
.month-pill:hover:not(.active){color:var(--ink);}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--hairline);}
table.ledger{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
}
table.ledger thead th{
  text-align:left;
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink-faint);
  padding:12px 14px;
  background:rgba(34,30,25,0.03);
  border-bottom:1px solid var(--hairline);
}
table.ledger thead th.num{width:38px;}
table.ledger thead th.data{width:150px;}
table.ledger thead th.valor{width:130px;text-align:right;}
table.ledger thead th.acao{width:40px;}
table.ledger tbody td{
  padding:6px 8px;
  border-bottom:1px solid var(--hairline);
  vertical-align:middle;
  font-size:13.5px;
}
table.ledger tbody tr:last-child td{border-bottom:none;}
table.ledger tbody tr:hover{background:rgba(34,30,25,0.03);}
table.ledger td.num{
  color:var(--ink-faint);
  font-size:12px;
  padding-left:10px;
}
.cell-input{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  padding:7px 7px;
  border-radius:8px;
  color:var(--ink);
}
.cell-input:hover{border-color:var(--hairline-strong);}
.cell-input:focus{
  outline:none;
  border-color:var(--gold);
  background:rgba(34,30,25,0.04);
}

@media (max-width:820px){
  .layout{
    align-items:stretch; /* o .layout vira coluna aqui, e o align-items
      herdado (flex-start) passa a valer no eixo HORIZONTAL: sem isso o
      .main encolhe pro tamanho do conteudo (a tabela tem min-width:640px,
      entao ele virava 715px numa tela de 375px), o excedente era cortado
      por body{overflow-x:hidden} e o scroll proprio da tabela nunca
      entrava — as colunas Data e Valor ficavam inalcancaveis. */
    flex-direction:column;}
  .rail{
    flex:0 0 auto; /* override the desktop 216px fixed size — that sets
      width in a row .layout, but once .layout goes column it sets HEIGHT
      instead, forcing every button to stretch tall (the "giant circle" bug) */
    flex-direction:row;
    align-items:center;
    overflow-x:auto;
    width:100%;
    top:auto; /* o top:16px do sticky, com position:relative, empurrava a barra 16px pra baixo */
    position:relative; /* keep the rail as an absolute-positioning context
      for .rail-slide-pill — "static" would hand that job to a further-up
      ancestor and misplace the pill entirely */
  }
  .rail-group-label,.rail-divider{display:none;}
  .tab-btn{flex:0 0 auto;}
  .tab-btn .tab-label{flex:0 0 auto;overflow:visible;text-overflow:clip;}
  .rail-add-form{flex:0 0 auto;width:210px;}

  /* alvos de toque: no dedo o minimo confortavel e 44-48px. O icone
     continua pequeno, so a area clicavel cresce. */
  .icon-btn{width:44px;height:44px;}
  .month-pill{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;}
  .year-switch button{width:40px;height:40px;}
  .cell-input{padding:11px 8px;}
  .privacy-toggle{min-height:44px;}
  .add-row-btn{min-height:44px;}

}

/* ---------- Celular: o lancamento deixa de ser linha de tabela ----------
   Uma tabela de 640px num aparelho de 375 obriga a rolar de lado pra
   digitar um valor. Aqui cada linha vira um cartao de tres faixas
   (video / cliente / data + valor) e o scroll horizontal some. O HTML
   continua sendo uma <table> — muda so o display, entao todos os
   handlers e o PDF seguem lendo a mesma estrutura. */
@media (max-width:640px){
  .table-wrap{overflow:visible;border:none;border-radius:0;}
  table.ledger{min-width:0;display:block;}
  table.ledger thead{display:none;}
  table.ledger tbody{display:flex;flex-direction:column;gap:8px;}
  table.ledger tbody tr{
    display:grid;
    /* a terceira coluna carrega o botao de excluir (44px) e o valor, que
       precisa de mais espaco — daí 104px, nao 44. */
    grid-template-columns:26px minmax(0,1fr) 104px;
    grid-template-areas:
      "num video acao"
      "num cliente cliente"
      "num data valor";
    align-items:center;
    gap:2px 6px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:8px 10px 10px 2px;
    box-shadow:var(--shadow-xs);
  }
  table.ledger tbody tr:hover{background:var(--surface-wash);}
  table.ledger tbody td{display:block;padding:0;border-bottom:none;}
  table.ledger tbody td.num{grid-area:num;text-align:center;padding-left:0;}
  table.ledger tbody td.video{grid-area:video;}
  table.ledger tbody td.cliente{grid-area:cliente;}
  table.ledger tbody td.data{grid-area:data;}
  table.ledger tbody td.valor{grid-area:valor;}
  table.ledger tbody td.acao{grid-area:acao;text-align:right;}
  table.ledger tbody td.video .cell-input{font-size:14.5px;font-weight:600;}
  table.ledger tbody td.cliente .cell-input{font-size:13.5px;color:var(--ink-soft);}
  table.ledger tbody td.data .cell-input{font-size:12px;padding-left:7px;}
  table.ledger tbody td.valor .valor-wrap{justify-content:flex-end;}
  table.ledger tbody td.valor .cell-input{font-size:15px;font-weight:600;}
  .table-foot{flex-direction:column;align-items:stretch;gap:10px;}
  .add-row-btn{text-align:center;}
  .action-bar .btn{flex:1 1 100%;text-align:center;}
  .action-top .btn{flex:1 1 0;min-width:0;padding-inline:10px;}
}

  /* topo: nome + olho na primeira linha, Painel/Lancamentos ocupando a segunda */

  .privacy-toggle{width:44px;height:44px;padding:0;justify-content:center;}

  .screen-nav{order:3;width:100%;}

/* ================================================================
   RITMO (identidade aprovada em 2026-09-27)
   Paleta "opção 1" (um tico mais escura), barra lateral oliva,
   Liquid Glass no Mac, One UI no celular. Só aparência: nenhuma
   função muda. Mockup: https://claude.ai/artifact/HEgsUbmUk8Z3prWw82hCmM
   ================================================================ */
:root{
  --fonte-logo:'Urbanist',system-ui,sans-serif; /* so a marca "ritmo." e a saudacao do topo */
  --bg:#E8E1D0; --surface:#FBF8F1; --surface-wash:#F3EEE2;
  --ink:#211D18; --ink-soft:#554E40; --ink-faint:#6A6356;
  --hairline:rgba(34,30,25,0.10); --hairline-strong:rgba(34,30,25,0.20);
  --sage:#56663C; --sage-wash:#D3DBC2; --sage-deep:#38432A;
  --gold:#7C5A12; --gold-wash:#EBD6A8; --gold-deep:#523C0C;
  --lavender:#43457A; --lavender-wash:#D8D7EA; --lavender-deep:#2E3055;
  --slate:#56663C; --status-ok:#38432A; --status-ok-wash:#D3DBC2;
  --status-warn:#523C0C; --status-warn-wash:#EBD6A8;
  --sidebar:#2E3925; --sidebar-raised:#394630; --sidebar-ink:#F6F2E8;
  --oliva:46,57,37;
  --chip-0:linear-gradient(180deg,#E2B659,#B98A2B); --chip-0-ink:#2B1E04;
  --chip-1:linear-gradient(180deg,#9FA2DD,#6E71B5); --chip-1-ink:#141539;
  --chip-2:linear-gradient(180deg,#AFC48D,#7E9560); --chip-2-ink:#18210E;
}

/* marca no topo + faixa do beta */
.ritmo-marca{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ritmo-marca>svg{width:28px;height:28px;display:block;flex:0 0 auto;}
.ritmo-marca .wm{font-family:var(--fonte-logo);font-weight:800;font-size:19px;letter-spacing:-.035em;line-height:1;color:var(--ink);}
.ritmo-marca .wm i{font-style:normal;color:#B98A2B;}
/* notinha imprimindo + check (so no icone animado) */
@keyframes rn-print{0%{transform:translateY(-70px)}25%{transform:translateY(-52px)}34%{transform:translateY(-52px)}60%{transform:translateY(-24px)}68%{transform:translateY(-24px)}100%{transform:translateY(0)}}
@keyframes rn-pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rn-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.rn-paper{animation:rn-print 1.5s cubic-bezier(.4,0,.3,1) both;}
.rn-circ{animation:rn-pop .45s cubic-bezier(.3,1.4,.5,1) 1.55s both;}
.rn-ck{stroke-dasharray:1;animation:rn-draw .4s ease-out 1.9s both;}
@media (prefers-reduced-motion:reduce){.rn-paper,.rn-circ,.rn-ck{animation:none}}
.faixa-beta{margin:0 auto 12px;max-width:560px;text-align:center;font:800 11px 'Manrope',sans-serif;letter-spacing:.08em;color:#2A1C06;background:#F0C987;border-radius:8px;padding:5px 10px;}

/* olho de ocultar valores: so o icone, redondo */
.privacy-toggle{width:42px;height:42px;padding:0;justify-content:center;border-radius:999px;}
.privacy-toggle svg{width:18px;height:18px;}
.screen-nav button span{white-space:nowrap;}

/* bolinhas dos clientes: cor cheia, iniciais escuras (os nomes aparecem bem) */
.tab-chip.chip-0,.tab-btn.active .tab-chip.chip-0{background:var(--chip-0);color:var(--chip-0-ink);}
.tab-chip.chip-1,.tab-btn.active .tab-chip.chip-1{background:var(--chip-1);color:var(--chip-1-ink);}
.tab-chip.chip-2,.tab-btn.active .tab-chip.chip-2{background:var(--chip-2);color:var(--chip-2-ink);}

/* barra lateral oliva (vale no Mac e no tablet) */
.rail{
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 30%), rgba(var(--oliva),.9);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 26px 50px -24px rgba(20,18,15,.55);
}
.tab-btn{color:#F6F2E8;}
.rail-slide-pill{background:rgba(255,255,255,.95);box-shadow:0 6px 16px -8px rgba(0,0,0,.5);}
.rail-group-label{color:rgba(246,242,232,.6);}
.toast{background:#2E3925;}

/* ---------------- Mac / computador: Liquid Glass ---------------- */
@media (min-width:821px){
  body{
    background:
      radial-gradient(560px 460px at 12% 6%, rgba(86,102,60,.42), transparent 70%),

  .dash .card-hero{background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 45%), rgba(211,219,194,.76);}
  .dash .card-meta{background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 45%), rgba(235,214,168,.72);}
  .screen-nav,

    -webkit-backdrop-filter:blur(24px) saturate(1.6); backdrop-filter:blur(24px) saturate(1.6);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:inset 0 1px 0 #fff, 0 12px 28px -18px rgba(34,30,25,.5);

  .tab-btn{padding:9px 10px;font-size:14px;gap:12px;border-radius:14px;}

  .rail-slide-pill{border-radius:14px;}

}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

/* ---------------- tablet e celular: clientes em "pílulas" claras ---------------- */

  .rail{background:transparent;border:0;box-shadow:none;padding:2px 0 6px;gap:8px;border-radius:0;}
  .rail-slide-pill{display:none;}
  .tab-btn{background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;padding:8px 16px 8px 8px;min-height:52px;border-radius:999px;box-shadow:0 1px 2px rgba(34,30,25,.10);}
  .tab-btn.active,.tab-btn.active:hover{background:var(--ink);color:var(--bg);box-shadow:none;}
  .tab-chip{width:36px;height:36px;border-radius:999px;font-size:11px;font-weight:800;}
  .tab-btn:not(.active) .tab-chip:not([class*="chip-"]){background:rgba(34,30,25,.08);color:var(--ink-soft);}
  .rail-add{color:var(--ink-soft);border-color:rgba(34,30,25,.25);}
  /* fileiras que deslizam de lado: sem a barrinha de rolagem cinza */
  .rail,.months{scrollbar-width:none;}
  .rail::-webkit-scrollbar,.months::-webkit-scrollbar{display:none;}

@media (max-width:760px){
  #app{padding:0 16px calc(120px + env(safe-area-inset-bottom));}
  /* área de ver em cima (título grande), área de tocar embaixo */
  .topbar{padding:48px 4px 20px;gap:10px;}

  .ritmo-marca>svg{width:34px;height:34px;}

.lc-mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.lc-mh small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
.lc-mh span{font-size:12.5px;color:var(--ink-faint);}
.lc-mh span b{color:var(--ink);}
/* meses em minigrafico */
.months.lc-bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;width:auto;max-width:none;
  background:none;border:0;border-radius:0;padding:0;margin:0;overflow:visible;}
.months.lc-bars .month-slide-pill{display:none;}
.months.lc-bars .month-pill{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;min-height:0;border-radius:0;background:none;color:var(--ink-soft);}
.months.lc-bars .month-pill::after{display:none;}
.lc-col{height:74px;width:100%;display:flex;align-items:flex-end;justify-content:center;background:var(--bg);border-radius:12px;padding:5px;box-sizing:border-box;transition:background var(--dur-base) var(--ease);}
.lc-bar{display:block;width:100%;border-radius:8px;background:rgba(95,114,72,.42);transition:height .5s var(--ease);}
.month-pill:hover .lc-col{background:rgba(34,30,25,.08);}
.lc-m{font-size:12.5px;font-weight:600;}
.month-pill.active .lc-col{background:#2E3925;box-shadow:0 8px 16px -10px rgba(34,30,25,.7);}
.month-pill.active .lc-bar{background:#E2B659;}
.month-pill.active .lc-m{color:var(--ink);font-weight:800;}
.month-pill.open-p .lc-m::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#B98A2B;margin-left:4px;vertical-align:2px;}
.month-pill.closed .lc-m::after{content:"✓";font-size:10px;color:var(--sage);margin-left:3px;}
.lc-lista .action-top{margin:0 0 12px;}
.lc-lista .table-foot{padding-top:12px;}
@media (min-width:821px){
  .lc-card{background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.18) 38%, rgba(255,255,255,.10)), rgba(251,248,241,.62);
    -webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35), 0 22px 44px -26px rgba(34,30,25,.45);}
  .lc-lista .table-wrap{background:rgba(255,255,255,.35);}
}
@media (max-width:820px){
  .main.main-lc{gap:10px;}
  .lc-card{padding:16px;border-radius:26px;border:0;box-shadow:0 1px 2px rgba(34,30,25,.08);}
  .lc-st{box-shadow:0 1px 2px rgba(34,30,25,.08);border-radius:24px;}
  .lc-stats{grid-template-columns:1fr 1fr;gap:10px;}
  .lc-st-g{grid-column:span 2;}
  .lc-st b{font-size:23px;}
  .lc-cli{flex-wrap:wrap;}
  .year-switch.lc-ano{flex:1 1 100%;justify-content:space-between;}
  .year-switch.lc-ano button{width:52px;height:46px;}
  .lc-nome .panel-title{font-size:22px;}
  .months.lc-bars{display:flex;overflow-x:auto;gap:8px;padding:2px 2px 4px;scrollbar-width:none;}
  .months.lc-bars .month-pill{flex:0 0 40px;min-height:0;}
  .lc-col{height:64px;}
}

html.escuro .months.lc-bars .month-pill.active,.months.lc-bars .month-pill.active{background:none;color:var(--ink);}

html.escuro .lc-st{box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 32px -22px rgba(0,0,0,.7);}
html.escuro .lc-bar{background:rgba(164,189,130,.5);}
html.escuro .month-pill:hover .lc-col{background:rgba(236,230,214,.08);}

@media (min-width:821px){

.off-mic{width:84px;height:84px;margin:-8px;flex:0 0 auto;display:block;}

/* ================================================================
   MODO ESCURO "A — Oliva noturno" (escolhido em 2026-09-29)
   Mockup: https://claude.ai/artifact/EdgPMts5ujWy41pEAPsPR4
   Ligado pela classe html.escuro (Configuracoes > Aparencia).
   ================================================================ */
html.escuro{
  color-scheme:dark;
  --bg:#171B14; --surface:#22281D; --surface-wash:#1D2219;
  --ink:#ECE6D6; --ink-soft:#C2BBA8; --ink-faint:#A39C89;
  --hairline:rgba(236,230,214,.10); --hairline-strong:rgba(236,230,214,.20);
  --sage:#A4BD82; --sage-wash:#243022; --sage-deep:#C6D8AA;
  --gold:#D9AE55; --gold-wash:#35301F; --gold-deep:#E9C97F;
  --lavender:#A9ABE6; --lavender-wash:#262740; --lavender-deep:#CBCCF2;
  --slate:#A4BD82; --accent-soft:#D9AE55; --accent-wash:rgba(217,174,85,.14);
  --status-ok:#C6D8AA; --status-ok-wash:#243022; --status-warn:#E9C97F; --status-warn-wash:#35301F;
  --danger:#E8907E; --danger-wash:rgba(232,144,126,.14);
  --sidebar:#2E3925; --sidebar-raised:#3A4830; --sidebar-ink:#F6F2E8;
  --shadow-xs:0 1px 2px rgba(0,0,0,.35); --shadow-card:0 10px 24px -16px rgba(0,0,0,.6); --shadow-hover:0 16px 32px -18px rgba(0,0,0,.7);
}
html.escuro body{background:var(--bg);color:var(--ink);}
/* botoes e campos */
html.escuro .btn{background:var(--surface);color:var(--ink);border-color:var(--hairline-strong);}
html.escuro .btn:hover{background:rgba(236,230,214,.06);}
html.escuro .btn.primary{background:#3A4830;border-color:#3A4830;color:#F6F2E8;box-shadow:0 6px 16px -10px rgba(0,0,0,.6);}
html.escuro .btn.primary:hover{background:#465638;}
html.escuro .btn.gold{background:#D9AE55;border-color:#D9AE55;color:#241A05;}
html.escuro .btn.gold:hover{background:#E5BD68;}
html.escuro .year-switch button,html.escuro .cell-date,html.escuro .cal-nav button,html.escuro .fj-x{background:rgba(236,230,214,.08);}
html.escuro .year-switch button:hover,html.escuro .cell-date:hover,html.escuro .cal-dias button:hover{background:rgba(236,230,214,.12);}
html.escuro table.ledger tbody tr:hover,html.escuro .field input:focus{background:rgba(236,230,214,.04);}
html.escuro .add-row-btn:hover{background:rgba(217,174,85,.10);}
html.escuro input,html.escuro select,html.escuro textarea{color:var(--ink);}
html.escuro .fj-campo,html.escuro .cnpj-in{background:#1B2017;border-color:var(--hairline-strong);color:var(--ink);}
html.escuro .fj-copiar{background:#2F3B28;color:#C6D8AA;}
html.escuro .fj-copiar.ok{background:#A4BD82;color:#141A10;}
html.escuro .fj-ok{background:#243022;color:#C6D8AA;}
html.escuro .ordem-btn{background:var(--surface);}
/* barra lateral: aba ativa e pilula clara, entao texto escuro */
html.escuro .tab-btn.active{color:#171B14;}
/* Painel */
html.escuro .dash .edit-btn,html.escuro .periodo-banner button{background:rgba(236,230,214,.08);border-color:var(--hairline-strong);}
html.escuro .dash .card-hero .bar,html.escuro .dash .card-meta .bar,html.escuro .dash .card-year .cmp .track{background:rgba(236,230,214,.10);}
html.escuro .dash .card-year .cmp .track i{background:rgba(169,171,230,.55);}
html.escuro .dash .dcol.we{background:rgba(236,230,214,.03);}
html.escuro .month-pill.active{background:#ECE6D6;color:#171B14;}
html.escuro .month-pill.active .count{color:rgba(23,27,20,.65);}
html.escuro .screen-nav button.active{color:#171B14;}
html.escuro .toast{background:#3A4830;}
/* janelas de vidro */
html.escuro .fj-janela,html.escuro .cal-pop,html.escuro .off-aviso{background:rgba(34,40,29,.9);border-color:rgba(236,230,214,.12);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 70px rgba(0,0,0,.55);}
html.escuro .fj-veu,html.escuro .cal-veu{background:rgba(0,0,0,.45);}
html.escuro .cal-dias button.fora{color:#5C6152;}
html.escuro .cal-dias button.sel{background:#ECE6D6;color:#171B14;}
html.escuro .cal-dias button.sel i{background:#8A6416;}
html.escuro .cal-alca{background:#4A5240;}
@media (min-width:821px){

    background:
      radial-gradient(560px 460px at 12% 6%, rgba(86,102,60,.30), transparent 70%),

      var(--bg);

  }
  html.escuro .main,html.escuro .dash .card{

  }
  html.escuro .dash .card-year{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 45%), rgba(38,39,64,.85);}
  html.escuro .dash .card-hero{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 45%), rgba(36,48,34,.88);}
  html.escuro .dash .card-meta{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 45%), rgba(53,48,31,.88);}

  }
  html.escuro .table-wrap{background:rgba(0,0,0,.12);border-color:rgba(236,230,214,.08);}
  html.escuro .rail{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 30%), rgba(46,57,37,.72);border-color:rgba(236,230,214,.12);}
}
@media (max-width:820px){
  html.escuro .tab-btn{box-shadow:none;}

.tema-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;max-width:440px;background:rgba(33,29,24,.06);border-radius:16px;padding:4px;margin:0 0 6px;}
.tema-seg button{border:0;background:none;border-radius:12px;padding:10px 6px;font:600 13px 'Manrope',sans-serif;color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
.tema-seg button svg{width:20px;height:20px;}
.tema-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(33,29,24,.14);}
.tema-seg button:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px;}
html.escuro .tema-seg{background:rgba(236,230,214,.06);}
html.escuro .tema-seg button.on{background:#ECE6D6;color:#171B14;}
