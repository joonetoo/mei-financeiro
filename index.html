<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Neto Filmes — Controle Financeiro</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#F2EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Controle MEI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  /* "Extrato claro" — fundo creme + barra lateral escura, acentos foscos
     (verde-oliva, dourado, lavanda) no lugar do azul neon com brilho. */
  --bg:#F2EEE3;
  --surface:#FFFFFF;
  --surface-wash:#F8F5EE;

  --sidebar:#211D18;
  --sidebar-raised:#2B2418;
  --sidebar-active:#3A2F1C;
  --sidebar-active-ink:#F1DFB8;
  --sidebar-ink:#F2EEE3;
  --sidebar-ink-soft:#B9B2A6;
  --sidebar-ink-faint:#8B8272;
  --sidebar-hairline:rgba(255,255,255,0.08);
  --sidebar-hairline-strong:rgba(255,255,255,0.18);

  --ink:#211D18;
  --ink-soft:#5A5344;
  --ink-faint:#6E675C;
  --hairline:rgba(34,30,25,0.09);
  --hairline-strong:rgba(34,30,25,0.18);

  --sage:#5F7248;
  --sage-wash:#DCE3CD;
  --sage-deep:#3E4A2E;

  --gold:#8A6416;
  --gold-wash:#F3E1B8;
  --gold-deep:#5B430E;

  --lavender:#4A4C81;
  --lavender-wash:#E2E1F0;
  --lavender-deep:#33355C;

  /* nomes mantidos porque src/main.js os referencia diretamente (gauge SVG) */
  --slate:#5F7248;
  --accent-soft:#C99A44;
  --accent-wash:rgba(138,100,22,0.12);

  --status-ok:#3E4A2E;
  --status-ok-wash:#DCE3CD;
  --status-warn:#5B430E;
  --status-warn-wash:#F3E1B8;
  --danger:#A6402E;
  --danger-wash:rgba(166,64,46,0.12);

  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(34,30,25,.10);
  --shadow-card:0 10px 24px -16px rgba(34,30,25,.20);
  --shadow-hover:0 16px 32px -18px rgba(34,30,25,.26);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:14px; --text-md:15px; --text-lg:17px; --text-xl:21px; --text-2xl:26px; --text-3xl:34px;
  --ease:cubic-bezier(.22,.9,.32,1);
  --ease-slide:cubic-bezier(.66,.01,.24,1.02);
  --dur-fast:150ms; --dur-base:220ms; --dur-slide:440ms; --dur-fill:500ms; --dur-ring:600ms;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Public Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  #app *, #app *::before, #app *::after{
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}
@keyframes rowFadeUp{from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}
.row-enter{opacity:0;animation:rowFadeUp .4s var(--ease) forwards;}
.row-enter:nth-child(1){animation-delay:.02s;} .row-enter:nth-child(2){animation-delay:.05s;}
.row-enter:nth-child(3){animation-delay:.08s;} .row-enter:nth-child(4){animation-delay:.11s;}
.row-enter:nth-child(5){animation-delay:.14s;} .row-enter:nth-child(6){animation-delay:.17s;}
.row-enter:nth-child(7){animation-delay:.20s;} .row-enter:nth-child(8){animation-delay:.23s;}

/* -------- privacy / sensitive values --------
   Bolinhas em vez de desfoque, como em app de banco — cada caractere vira um
   ponto (o valor real continua ali, so o desenho do texto muda). */
body.privacy-on .sensitive{-webkit-text-security:disc;user-select:none;}

#app{
  max-width:1180px;
  margin:0 auto;
  padding:20px 20px 64px;
}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:14px 18px;
  padding:4px 2px 18px;
  flex-wrap:wrap;
}
.brand{flex:1 1 auto;min-width:0;}
.brand h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .sub{
  font-size:12px;
  color:var(--ink-faint);
  margin-top:2px;
}
.savestate{
  font-size:12px;
  color:var(--ink-faint);
  white-space:nowrap;
}
.savestate.saving{color:var(--gold-deep);}
.savestate.error{color:var(--danger);font-weight:600;white-space:normal;}

.topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.privacy-toggle{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--hairline-strong);
  color:var(--ink-soft);font-size:12.5px;font-weight:600;
  background:var(--surface);
}
.privacy-toggle:hover{color:var(--ink);}
.privacy-toggle.active{color:var(--gold-deep);border-color:var(--gold);}
.privacy-toggle svg{display:block;flex:0 0 auto;}
.privacy-toggle svg[hidden]{display:none;}

/* ---------- Troca de tela: Painel / Lançamentos ---------- */
.screen-nav{
  position:relative;display:inline-flex;gap:4px;padding:4px;
  background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);
  box-shadow:var(--shadow-card);
}
.screen-nav-pill{
  position:absolute;top:0;left:0;z-index:0;pointer-events:none;
  border-radius:var(--radius-pill);background:var(--ink);opacity:0;
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide);
  will-change:transform,width,height;
}
.screen-nav button{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;
  border:0;background:transparent;padding:9px 16px;border-radius:var(--radius-pill);
  font-size:13px;font-weight:700;color:var(--ink-soft);
  transition:color .25s var(--ease);
}
.screen-nav button.active{color:var(--bg);}
.screen-nav button:not(.active):hover{color:var(--ink);}
.screen-nav button svg{flex:0 0 auto;}
@keyframes screenIn{from{opacity:.4;transform:translateY(4px);} to{opacity:1;transform:none;}}
.screen-in{animation:screenIn .35s var(--ease);}

/* ---------- Painel ----------
   Tela so de leitura: limite, meta do mes, hoje, semana, graficos. Tudo
   escopado em .dash pra nao esbarrar nas classes da tela de Lancamentos. */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;}
.dash .s3{grid-column:span 3;} .dash .s4{grid-column:span 4;} .dash .s5{grid-column:span 5;}
.dash .s6{grid-column:span 6;} .dash .s7{grid-column:span 7;} .dash .s8{grid-column:span 8;}
.dash .card{
  position:relative;border-radius:20px;box-shadow:var(--shadow-card);padding:20px 22px;
  display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--hairline);min-width:0;
}
.dash .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.dash .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.dash .new{display:inline-block;margin-left:6px;vertical-align:1px;background:#1F5FBF;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:999px;}
.dash .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.dash .pill.ok{background:var(--status-ok-wash);color:var(--status-ok);}
.dash .pill.warn{background:var(--status-warn-wash);color:var(--status-warn);border:1px solid rgba(91,67,14,.25);}
.dash .pill.danger{background:var(--danger-wash);color:var(--danger);}
.dash .pill.done{background:var(--sage);color:#fff;}
.dash .big{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:30px;}
.dash .msg{font-size:13.5px;color:var(--ink-soft);margin:0;}
.dash .msg b{font-weight:600;color:var(--ink);}
.dash .sub{font-size:12.5px;color:var(--ink-soft);margin:0;}
.dash .sub b{color:var(--ink);font-weight:600;}
.dash .bar{position:relative;height:10px;border-radius:6px;}
.dash .bar .fill{height:10px;border-radius:6px;transition:width .6s var(--ease);}
.dash .bar .pace{position:absolute;top:-5px;width:2px;height:20px;border-radius:1px;background:var(--status-warn);}
.dash .foot{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--ink-soft);}
.dash .foot .pace-t{color:var(--status-warn);}

.dash .card-hero{background:var(--sage-wash);border-color:rgba(95,114,72,.35);}
.dash .card-hero .label{color:var(--sage-deep);}
.dash .card-hero .big{font-size:42px;color:var(--sage-deep);}
.dash .card-hero .bar{background:rgba(46,56,33,.16);}
.dash .card-hero .fill{background:var(--sage);}
.dash .card-hero .fill.warn{background:var(--status-warn);}
.dash .card-hero .fill.danger{background:var(--danger);}
.dash .card-hero .msg b{color:var(--sage-deep);}

.dash .card-meta{background:var(--gold-wash);border-color:rgba(138,100,22,.25);}
.dash .card-meta .label{color:var(--gold-deep);}
.dash .card-meta .big{color:var(--gold-deep);}
.dash .card-meta .of{font-size:13px;color:var(--gold-deep);font-weight:600;white-space:nowrap;}
.dash .vrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.dash .card-meta .bar{background:rgba(91,67,14,.16);}
.dash .card-meta .fill{background:var(--gold);}
.dash .card-meta .msg b{color:var(--gold-deep);}
.dash .head-r{display:inline-flex;align-items:center;gap:6px;}
.dash .edit-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(91,67,14,.3);background:rgba(255,255,255,.55);color:var(--gold-deep);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;}
.dash .edit-btn:hover{background:#fff;}
.dash .meta-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dash .meta-form label{font-size:12px;color:var(--gold-deep);font-weight:600;width:100%;}
.dash .money-in{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:8px 12px;flex:1 1 140px;}
.dash .money-in span{color:var(--ink-faint);font-weight:600;}
.dash .money-in input{border:0;outline:0;font-size:16px;font-weight:600;width:100%;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;}
.dash .btn-dark{border:0;background:var(--gold-deep);color:var(--gold-wash);border-radius:999px;padding:9px 16px;font-weight:700;}
.dash .btn-line{border:1px solid var(--hairline-strong);background:transparent;color:var(--ink-soft);border-radius:999px;padding:8px 14px;font-weight:600;}
.dash button:focus-visible,.dash input:focus-visible,.screen-nav button:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px;}

.dash .card-year{background:var(--lavender-wash);border-color:rgba(74,76,129,.2);justify-content:space-between;}
.dash .card-year .label{color:var(--lavender-deep);}
.dash .card-year .big{font-size:28px;color:var(--lavender-deep);}
.dash .card-year .sub{color:var(--lavender-deep);}

.dash .quick{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:auto;border:1px solid var(--hairline-strong);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;transition:background .2s var(--ease),transform .15s var(--ease);}
.dash .quick:hover{background:var(--sage-wash);}
.dash .quick:active{transform:scale(.97);}

.dash .card-week{flex-direction:row;align-items:stretch;gap:22px;}
.dash .card-week .left{display:flex;flex-direction:column;gap:10px;flex:0 0 200px;}
.dash .wbars{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;min-height:120px;}
.dash .wb{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.dash .wb .v{font-size:10.5px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.dash .wb .col{width:100%;max-width:40px;border-radius:7px 7px 3px 3px;background:var(--sage-wash);}
.dash .wb.today .col{background:var(--sage);}
.dash .wb.today .v,.dash .wb.today .d{color:var(--sage-deep);}
.dash .wb.future .col{background:transparent;border:1.5px dashed var(--hairline-strong);height:16px;}
.dash .wb .d{font-size:11px;color:var(--ink-faint);font-weight:600;}

/* grafico dia a dia */
.dash .chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;}
.dash .yaxis{display:flex;flex-direction:column;justify-content:space-between;height:150px;font-size:10px;color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;transform:translateY(-6px);}
.dash .plot{position:relative;height:150px;border-bottom:1px solid var(--hairline-strong);}
.dash .grid-l{position:absolute;left:0;right:0;border-top:1px dashed var(--hairline);}
.dash .avg{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none;}
.dash .avg span{position:absolute;right:0;top:-20px;font-size:10.5px;font-weight:700;color:var(--gold-deep);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap;}
.dash .days{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--dias,30),minmax(0,1fr));gap:3px;align-items:end;}
.dash .dcol{height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px;}
.dash .dcol.we{background:rgba(34,30,25,.035);}
.dash .dcol i{display:block;width:100%;max-width:18px;border-radius:4px 4px 1px 1px;background:var(--sage);opacity:.85;transition:opacity .15s;}
.dash .dcol:hover i{opacity:1;}
.dash .dcol.today i{background:var(--sage-deep);opacity:1;}
.dash .dcol.future i{background:transparent;border:1.5px dashed var(--hairline-strong);height:10px;}
.dash .xaxis{grid-column:2;display:grid;grid-template-columns:repeat(var(--dias,30),minmax(0,1fr));gap:3px;font-size:10px;color:var(--ink-faint);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums;}
.dash .xaxis span{white-space:nowrap;}
.dash .xaxis .t{color:var(--sage-deep);font-weight:700;}
.dash .stats3{display:flex;gap:10px 22px;flex-wrap:wrap;}
.dash .stats3 div{display:flex;flex-direction:column;}
.dash .stats3 b{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;}
.dash .stats3 span{font-size:11.5px;color:var(--ink-soft);}

/* por cliente */
.dash .clients{display:flex;flex-direction:column;gap:14px;}
.dash .cl{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;}
.dash .chip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;grid-row:span 2;}
.dash .chip.chip-0{background:var(--gold-wash);color:var(--gold-deep);}
.dash .chip.chip-1{background:var(--lavender-wash);color:var(--lavender-deep);}
.dash .chip.chip-2{background:var(--sage-wash);color:var(--sage-deep);}
.dash .stack i.chip-0,.dash .track i.chip-0{background:var(--gold);}
.dash .stack i.chip-1,.dash .track i.chip-1{background:var(--lavender);}
.dash .stack i.chip-2,.dash .track i.chip-2{background:var(--sage);}
.dash .cl .n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .cl .v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;text-align:right;}
.dash .cl .track{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;}
.dash .cl .track i{display:block;height:100%;border-radius:5px;}
.dash .cl .meta-l{font-size:11.5px;color:var(--ink-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.dash .stack{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;}

/* notas por mes */
.dash .mchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;}
.dash .mplot{position:relative;height:170px;border-bottom:1px solid var(--hairline-strong);}
.dash .mcols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;}
.dash .mcol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
.dash .mcol i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:#B9BADB;}
.dash .mcol.cur i{background:var(--lavender);}
.dash .mcol.future i{background:transparent;border:1.5px dashed var(--hairline-strong);height:10px;}
.dash .mcol.zero i{height:2px;background:var(--hairline-strong);}
.dash .ref{position:absolute;left:0;right:0;border-top:2px dashed var(--sage);pointer-events:none;}
.dash .ref span{position:absolute;right:0;top:-20px;font-size:10.5px;font-weight:700;color:var(--sage-deep);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap;}
.dash .mx{grid-column:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:4px;}
.dash .mx .t{color:var(--lavender-deep);font-weight:700;}

/* ultimos videos */
.dash .recent{display:flex;flex-direction:column;}
.dash .rv{display:grid;grid-template-columns:34px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-top:1px solid var(--hairline);}
.dash .rv:first-child{border-top:0;padding-top:0;}
.dash .rv .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .rv .s{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash .rv .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;grid-row:span 2;}

/* ---------- Layout: rail + main ---------- */
.layout{
  display:flex;
  gap:22px;
  align-items:flex-start;
}
.rail{
  flex:0 0 216px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:var(--sidebar);
  border:1px solid var(--sidebar-hairline);
  border-radius:var(--radius-lg);
  padding:14px;
  position:sticky;
  top:16px;
}
.rail-group-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--sidebar-ink-faint);
  padding:8px 10px 4px;
}
.rail-slide-pill{
  position:absolute; top:0; left:0; z-index:0; pointer-events:none; border-radius:var(--radius-sm);
  background:rgba(201,154,68,0.16); border:1px solid var(--gold);
  transition:transform var(--dur-slide) var(--ease-slide), width var(--dur-slide) var(--ease-slide), height var(--dur-slide) var(--ease-slide), opacity var(--dur-base) ease;
  will-change:transform,width,height; opacity:0;
}
.tab-btn{
  position:relative; z-index:1;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  background:transparent;
  border:none;
  padding:10px 12px;
  font-size:14px;
  font-weight:500;
  color:var(--sidebar-ink-soft);
  border-radius:var(--radius-sm);
  transition:color var(--dur-base) var(--ease);
}
.tab-btn:hover:not(.active){color:var(--sidebar-ink);}
.tab-btn.active{color:var(--sidebar-active-ink);font-weight:600;}
.tab-chip{
  width:28px;height:28px;border-radius:var(--radius-xs);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:'Public Sans',sans-serif;font-weight:700;font-size:11.5px;
  background:rgba(255,255,255,0.08);color:var(--sidebar-ink-soft);
}
.tab-btn .tab-label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab-btn .tag{
  font-size:11px;

/* ---------- Celular: o lancamento deixa de ser linha de tabela ----------
   Uma tabela de 640px num aparelho de 375 obriga a rolar de lado pra
   digitar um valor. Aqui cada linha vira um cartao de tres faixas
   (video / cliente / data + valor) e o scroll horizontal some. O HTML
   continua sendo uma <table> — muda so o display, entao todos os
   handlers e o PDF seguem lendo a mesma estrutura. */
@media (max-width:640px){
  .table-wrap{overflow:visible;border:none;border-radius:0;}
  table.ledger{min-width:0;display:block;}
  table.ledger thead{display:none;}
  table.ledger tbody{display:flex;flex-direction:column;gap:8px;}
  table.ledger tbody tr{
    display:grid;
    /* a terceira coluna carrega o botao de excluir (44px) e o valor, que
       precisa de mais espaco — daí 104px, nao 44. */
    grid-template-columns:26px minmax(0,1fr) 104px;
    grid-template-areas:
      "num video acao"
      "num cliente cliente"
      "num data valor";
    align-items:center;
    gap:2px 6px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:8px 10px 10px 2px;
    box-shadow:var(--shadow-xs);
  }
  table.ledger tbody tr:hover{background:var(--surface-wash);}
  table.ledger tbody td{display:block;padding:0;border-bottom:none;}
  table.ledger tbody td.num{grid-area:num;text-align:center;padding-left:0;}
  table.ledger tbody td.video{grid-area:video;}
  table.ledger tbody td.cliente{grid-area:cliente;}
  table.ledger tbody td.data{grid-area:data;}
  table.ledger tbody td.valor{grid-area:valor;}
  table.ledger tbody td.acao{grid-area:acao;text-align:right;}
  table.ledger tbody td.video .cell-input{font-size:14.5px;font-weight:600;}
  table.ledger tbody td.cliente .cell-input{font-size:13.5px;color:var(--ink-soft);}
  table.ledger tbody td.data .cell-input{font-size:12px;padding-left:7px;}
  table.ledger tbody td.valor .valor-wrap{justify-content:flex-end;}
  table.ledger tbody td.valor .cell-input{font-size:15px;font-weight:600;}
  .table-foot{flex-direction:column;align-items:stretch;gap:10px;}
  .add-row-btn{text-align:center;}
  .action-bar .btn{flex:1 1 100%;text-align:center;}
}
